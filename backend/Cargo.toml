[package]
name = "viernulvier_archive"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "viernulvier_archive"
path = "src/main.rs"

[dependencies]
api = { path = "crates/api" }
ingest = { path = "crates/ingest" }
db = { path = "crates/db" }

tracing = { workspace = true }
tokio = { workspace = true, features = [
    "rt-multi-thread",
    "signal",
    "process",
] }
tracing-subscriber = { version = "=0.3", default-features = false, features = [
    "env-filter",
    "fmt",
    "ansi",
] }
dotenvy = "0.15.7"

[workspace.lints.clippy]
unused_async = "warn"
indexing_slicing = "warn"
dbg_macro = "warn"
future_not_send = "warn"
await_holding_lock = "warn"
format_push_string = "warn"
cloned_instead_of_copied = "warn"
# pedantic
ignored_unit_patterns = "warn"
uninlined_format_args = "warn"
cast_lossless = "warn"
single_match_else = "warn"
needless_pass_by_value = "warn"
trivially_copy_pass_by_ref = "warn"
# nursery
use_self = "warn"
redundant_clone = "warn"

[lints]
workspace = true

[workspace]
members = ["crates/db", "crates/ingest", "crates/api"]

[workspace.dependencies]
tracing = { version = "=0.1", default-features = false }
tokio = { version = "1.50", default-features = false }
serde = { version = "1", features = ["derive"], default-features = false }
serde_json = "1.0.149"
uuid = { version = "1", features = ["v7"], default-features = false }
thiserror = { version = "2", default-features = false }
chrono = "0.4"
sha2 = "0.11"
aws-sdk-s3 = { version = "1.129", default-features = false, features = ["behavior-version-latest", "default-https-client", "rt-tokio", "sigv4a"] }
